<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K930 KARBELA 3 - TOTAL OTOMATIS + FOTO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="max-w-[480px] mx-auto bg-[#F7F7F7] dark:bg-[#121212] min-h-screen pb-[90px]">
<div class="bg-[#D40000] text-white p-5 rounded-b-[28px] sticky top-0 z-30">
<div class="flex justify-between items-center">
<div><h1 class="font-black text-[22px]">K930 KARBELA 3</h1><p class="text-[10px] opacity-80">TOTAL OTOMATIS + FOTO BUKTI</p></div>
<button onclick="toggleDark()" class="bg-white/20 w-10 h-10 rounded-full"><i class="fa-solid fa-moon"></i></button>
</div>
<div class="grid grid-cols-2 gap-2 mt-4">
<input id="nama" placeholder="Nama Staff PIC SO" class="rounded-xl p-3 text-black text-xs outline-none">
<input id="tanggal" type="date" class="rounded-xl p-3 text-black text-xs">
</div>
<div class="grid grid-cols-2 gap-2 mt-3">
<div class="bg-white/20 rounded-xl p-2"><p class="text-[8px] font-bold">BULAN INI</p><input id="bulanSekarang" type="month" onchange="gantiBulan()" class="w-full bg-transparent text-xs font-bold outline-none"></div>
<div class="bg-white/20 rounded-xl p-2"><p class="text-[8px] font-bold">BANDING BULAN</p><input id="bulanBanding" type="month" onchange="updateBanding()" class="w-full bg-transparent text-xs font-bold outline-none"></div>
</div>
<div class="grid grid-cols-3 gap-2 mt-3 text-[10px] font-bold text-center">
<div class="bg-white/20 rounded-xl p-2"><p id="done">0/115</p>RAK</div>
<div class="bg-white/20 rounded-xl p-2"><p id="top5">0 PLU</p>TOP5</div>
<div class="bg-white/20 rounded-xl p-2"><p id="totalMinus">Rp 0</p>TOTAL</div>
</div>
</div>

<div class="p-3"><div class="bg-white dark:bg-zinc-800 border rounded-xl flex items-center px-3"><i class="fa-solid fa-search text-xs text-gray-400"></i><input id="search" oninput="render()" placeholder="Cari AT1 AY0..." class="bg-transparent w-full p-3 outline-none text-xs dark:text-white"></div></div>

<div id="list" class="p-3 space-y-3"></div>

<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-t p-3 z-40 flex justify-center">
<button onclick="openMenu()" class="bg-[#D40000] text-white px-8 py-3 rounded-full font-black text-xs shadow-lg"><i class="fa-solid fa-bars mr-2"></i>MENU K930</button>
</div>

<div id="menuPopup" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center" onclick="closeMenu()">
<div class="bg-white dark:bg-zinc-900 w-full max-w-[480px] rounded-t-[28px] p-5 space-y-3" onclick="event.stopPropagation()">
<div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto"></div>
<h3 class="font-black text-center dark:text-white">MENU K930 KARBELA 3</h3>
<button onclick="exportWA();closeMenu()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-bold text-sm"><i class="fa-brands fa-whatsapp mr-2"></i>EXPORT WA + FOTO</button>
<button onclick="save();closeMenu()" class="w-full bg-[#D40000] text-white py-4 rounded-xl font-bold text-sm">SIMPAN SEMUA</button>
<button onclick="closeMenu()" class="w-full bg-black text-white py-3 rounded-xl font-bold text-xs">TUTUP</button>
</div>
</div>

<script>
const ITEMS = ["AT1","AY0","AY1","AY2","AY3","AY4","AY5","AY6","AY7","AY8","AY9","AZ1","BA1","BA2","CB1","CF1","CH1","CR1","CR2","CR3","CR4","CX1","CX2","DB1","DD1","DJ1","DJ2","DJ3","DJ4","DJ5","DJ6","EB1","EC1","ED1","EE1","EF1","EJ1","EP1","EP2","EP3","EP4","EP5","FP1","FP2","FP3","FP4","FP5","FP6","FP7","FP8","HB1","HB2","HB3","HB4","HB5","HB6","HB7","HC1","HD1","HG1","HH1","HI1","HM1","HN1","HO1","HS1","HT1","JA1","JC1","KI1","KJ1","KL1","KO1","KS1","MC1","MD1","ME1","MI1","MI2","MI3","NA1","NF1","NP1","OA1","OB1","OB2","OC1","Q31","Q32","Q41","Q51","Q52","Q53","Q54","Q55","QA1","S11","S12","S13","S14","S15","S16","S17","S18"];
let bulanAktif = new Date().toISOString().slice(0,7);
let dataAll = JSON.parse(localStorage.getItem('K930_KARBELA3_ALL') || '{}');

function getDataBulan(b){ if(!dataAll[b]) dataAll[b]={}; return dataAll[b]; }
function getDataAktif(){ return getDataBulan(bulanAktif); }
function gantiBulan(){ bulanAktif=document.getElementById('bulanSekarang').value; render(); }
function openMenu(){ document.getElementById('menuPopup').classList.remove('hidden'); }
function closeMenu(){ document.getElementById('menuPopup').classList.add('hidden'); }
function toggleDark(){ document.documentElement.classList.toggle('dark'); localStorage.setItem('K930_DARK', document.documentElement.classList.contains('dark')); }

function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=document.getElementById('list'); list.innerHTML='';
 const data=getDataAktif();
 ITEMS.filter(c=>c.toLowerCase().includes(q)).forEach(code=>{
  const d=data[code]||{checked:false,rak:'',nominal:'',items:[],foto:''};
  // hitung total otomatis
  const totalOtomatis = (d.items||[]).reduce((a,b)=>a+Number(b.selisih||0),0);
  if(d.checked && totalOtomatis>0) d.nominal = totalOtomatis;

  let htmlItems='';
  if(d.checked){
   htmlItems=`<div class="p-2 bg-red-50 dark:bg-red-900/10 space-y-2 rounded-xl">
   <div class="flex justify-between items-center"><p class="text-[11px] font-black text-red-600">TOTAL OTOMATIS: Rp ${totalOtomatis.toLocaleString('id-ID')}</p><span class="text-[9px] bg-red-600 text-white px-2 py-1 rounded-full">AUTO</span></div>`;
   (d.items||[]).forEach((it,i)=>{
    htmlItems+=`<div class="bg-white dark:bg-zinc-800 border dark:border-zinc-700 rounded-xl p-2 space-y-1">
      <div class="grid grid-cols-12 gap-1"><input value="${it.plu||''}" oninput="uItem('${code}',${i},'plu',this.value)" placeholder="PLU" class="col-span-3 border rounded p-2 text-[12px] dark:bg-zinc-900 dark:text-white outline-none"><input value="${it.nama||''}" oninput="uItem('${code}',${i},'nama',this.value)" placeholder="Nama Barang" class="col-span-7 border rounded p-2 text-[12px] dark:bg-zinc-900 dark:text-white outline-none"><button onclick="dItem('${code}',${i})" class="col-span-2 bg-red-100 text-red-600 rounded"><i class="fa-solid fa-trash text-[11px]"></i></button></div>
      <div class="grid grid-cols-2 gap-1"><input value="${it.selisih||''}" oninput="uItem('${code}',${i},'selisih',this.value)" type="number" inputmode="numeric" placeholder="Selisih Rp (auto jumlah)" class="border rounded p-2 text-[12px] dark:bg-zinc-900 dark:text-white outline-none font-bold"><input value="${it.qty||''}" oninput="uItem('${code}',${i},'qty',this.value)" type="number" placeholder="Qty" class="border rounded p-2 text-[12px] dark:bg-zinc-900 dark:text-white outline-none"></div></div>`;
   });
   if((d.items||[]).length<5) htmlItems+=`<button onclick="aItem('${code}')" class="w-full py-3 border-2 border-dashed border-red-300 text-red-600 rounded-xl text-[11px] font-black">+ TAMBAH PLU (${(d.items||[]).length}/5)</button>`;
   
   // FOTO BUKTI
   htmlItems+=`<div class="bg-white dark:bg-zinc-800 border dark:border-zinc-700 rounded-xl p-2">
     <p class="text-[10px] font-black mb-1"><i class="fa-solid fa-camera mr-1"></i>BUKTI FOTO RAK ${code}:</p>
     ${d.foto ? `<img src="${d.foto}" class="w-full h-32 object-cover rounded-lg mb-2"><div class="flex gap-2"><button onclick="hapusFoto('${code}')" class="flex-1 bg-red-100 text-red-600 py-2 rounded-lg text-[10px] font-bold">HAPUS FOTO</button><label class="flex-1 bg-gray-100 dark:bg-zinc-700 text-center py-2 rounded-lg text-[10px] font-bold dark:text-white cursor-pointer">GANTI FOTO<input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadFoto('${code}',this)"></label></div>` : `<label class="w-full border-2 border-dashed border-gray-300 dark:border-zinc-600 rounded-xl py-6 flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-camera text-xl text-gray-400"></i><span class="text-[11px] font-bold mt-1 dark:text-white">AMBIL FOTO RAK</span><span class="text-[9px] text-gray-400">Bukti SO</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadFoto('${code}',this)"></label>`}
   </div></div>`;
  }
  const el=document.createElement('div'); el.className=`bg-white dark:bg-zinc-800 rounded-2xl border dark:border-zinc-700 overflow-hidden ${d.checked?'border-[#D40000] shadow':''}`;
  el.innerHTML=`<label class="flex justify-between items-center p-3"><div class="flex items-center gap-2"><input type="checkbox" ${d.checked?'checked':''} onchange="tog('${code}')" class="w-5 h-5 accent-[#D40000]"><div class="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-black ${d.checked?'bg-[#D40000] text-white':'bg-gray-100 dark:bg-zinc-700 dark:text-white'}">${code}</div><b class="text-[13px] dark:text-white">${code}</b>${d.foto?'<i class="fa-solid fa-camera text-green-500 text-[10px]"></i>':''}</div><span class="text-[10px] font-bold dark:text-gray-300">${d.checked?`Rp${totalOtomatis.toLocaleString('id-ID')} | ${d.rak||'-'}`:'BELUM'}</span></label><div class="${d.checked?'':'hidden'} border-t dark:border-zinc-700 p-3 space-y-2 bg-[#FFF8F8] dark:bg-zinc-900"><div class="grid grid-cols-2 gap-2"><input value="${d.rak}" oninput="set('${code}','rak',this.value.toUpperCase())" placeholder="No Rak ex: B-01" class="border rounded-lg p-2.5 text-[13px] dark:bg-zinc-800 dark:text-white outline-none"><div class="border rounded-lg p-2.5 text-[13px] bg-gray-100 dark:bg-zinc-800 dark:text-white font-black">Rp ${totalOtomatis.toLocaleString('id-ID')} <span class="text-[8px] font-normal">AUTO</span></div></div>${htmlItems}</div>`;
  list.appendChild(el);
 }); upd();
}
function tog(c){ let d=getDataAktif(); if(!d[c]) d[c]={checked:false,rak:'',nominal:'',items:[],foto:''}; d[c].checked=!d[c].checked; if(!d[c].checked) delete d[c]; ls(); render(); }
function set(c,k,v){ let d=getDataAktif(); if(!d[c]) d[c]={checked:true,rak:'',nominal:'',items:[],foto:''}; d[c][k]=v; ls(); upd(); }
function uItem(c,i,k,v){ let d=getDataAktif(); d[c].items[i][k]=v; // hitung ulang total
 let total = d[c].items.reduce((a,b)=>a+Number(b.selisih||0),0); d[c].nominal=total; ls(); upd(); 
 // update text total otomatis di UI tanpa render ulang
 const el = document.getElementById('list'); // biar gak nutup keyboard, kita cuma update angka total di header
 renderNoFull();
}
function renderNoFull(){ // render ringan cuma update angka, gak bikin keyboard ketutup
 let data=getDataAktif(); let totalPLU=0,totalRp=0; Object.values(data).forEach(v=>{ totalPLU+=(v.items||[]).length; totalRp+=Number(v.nominal||0); });
 document.getElementById('done').innerText=Object.values(data).filter(v=>v.checked).length+'/'+ITEMS.length; document.getElementById('top5').innerText=totalPLU+' PLU'; document.getElementById('totalMinus').innerText='Rp '+totalRp.toLocaleString('id-ID');
}
function aItem(c){ let d=getDataAktif(); if(!d[c].items) d[c].items=[]; if(d[c].items.length>=5) return; d[c].items.push({plu:'',nama:'',selisih:'',qty:''}); ls(); render(); }
function dItem(c,i){ let d=getDataAktif(); d[c].items.splice(i,1); let total=d[c].items.reduce((a,b)=>a+Number(b.selisih||0),0); d[c].nominal=total; ls(); render(); }
function uploadFoto(code,input){
 const file=input.files[0]; if(!file) return;
 const reader=new FileReader();
 reader.onload=e=>{
  let d=getDataAktif(); if(!d[code]) d[code]={checked:true,rak:'',nominal:'',items:[],foto:''};
  // compress
  const img=new Image(); img.src=e.target.result;
  img.onload=()=>{
   const canvas=document.createElement('canvas'); const max=800; let w=img.width,h=img.height;
   if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
   canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
   d[code].foto=canvas.toDataURL('image/jpeg',0.6); ls(); render();
  };
 };
 reader.readAsDataURL(file);
}
function hapusFoto(code){ let d=getDataAktif(); if(d[code]){ d[code].foto=''; ls(); render(); } }
function ls(){ localStorage.setItem('K930_KARBELA3_ALL', JSON.stringify(dataAll)); }
function upd(){ renderNoFull(); updateBanding(); }
function updateBanding(){ const b1=document.getElementById('bulanSekarang').value; const b2=document.getElementById('bulanBanding').value; if(!b2){ document.getElementById('panelBanding')?.classList.add('hidden'); return; } }
function save(){ ls(); alert('Tersimpan K930 '+bulanAktif+' + foto!'); }
function resetBulan(){ if(confirm('Reset bulan '+bulanAktif+'?')){ dataAll[bulanAktif]={}; ls(); render(); } }
function exportWA(){ const n=document.getElementById('nama').value||'STAFF'; const b1=document.getElementById('bulanSekarang').value; let txt=`*LAPORAN SO K930 KARBELA 3*%0AToko: K930 KARBELA 3%0ABulan: ${b1}%0AStaff: ${n}%0A%0A`; const data=getDataAktif(); Object.entries(data).forEach(([code,v])=>{ txt+=`*${code} ${v.rak||''} Rp${Number(v.nominal||0).toLocaleString('id-ID')} ${v.foto?'📸':''}*%0A`; (v.items||[]).forEach((it,i)=>{ txt+=`${i+1}. PLU ${it.plu||'-'} ${it.nama||'-'} Qty${it.qty||'-'} Rp${Number(it.selisih||0).toLocaleString('id-ID')}%0A`; }); txt+=`%0A`; }); window.open(`https://wa.me/?text=${txt}`,'_blank'); }

const now=new Date().toISOString().slice(0,7); const next=new Date(new Date().setMonth(new Date().getMonth()+1)).toISOString().slice(0,7);
document.getElementById('bulanSekarang').value=now; document.getElementById('bulanBanding').value=next; bulanAktif=now;
document.getElementById('tanggal').valueAsDate=new Date();
if(localStorage.getItem('K930_DARK')==='true') document.documentElement.classList.add('dark');
render();
</script>
</body>
</html>
